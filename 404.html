<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="favicon.ico"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VCMGLLZQB1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VCMGLLZQB1');
</script>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Page Not Found | albtaa.com</title>
<meta name="robots" content="noindex, follow"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0e1b2e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:480px}
.code{font-family:'Manrope',sans-serif;font-weight:800;font-size:5rem;color:#b22234;line-height:1;margin-bottom:8px}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.6rem;margin-bottom:14px}
p{color:rgba(255,255,255,.6);font-size:.95rem;line-height:1.6;margin-bottom:28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;padding:13px 26px;border-radius:100px;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .18s}
.btn-red{background:#b22234;color:#fff}
.btn-red:hover{background:#d42840}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <div class="btns">
    <a href="/" class="btn btn-red">Go to Homepage →</a>
    <a href="contact.html" class="btn btn-ghost">Contact Us</a>
  </div>
</div>
<script>
(function(){
  'use strict';
  function trackEvent(data){
    try{
      if(typeof gtag==='function'){
        gtag('event', (data&&data.type)||'custom_event', {
          page_title: (data&&data.page)||document.title,
          page_location: (data&&data.pageUrl)||window.location.href,
          language: (data&&data.lang)||document.documentElement.lang||''
        });
      }
    }catch(e){}
  }
  window.albtaaTrackEvent = trackEvent;
  trackEvent({type:'404_view', page:document.title, lang:document.documentElement.lang||'', pageUrl:window.location.href});
})();
</script>
</body>
</html>
