<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <h2>Test Submission</h2>
  <form id="f">
    <input name="firstName" placeholder="Emri" value="Test" required><br>
    <input name="lastName" placeholder="Mbiemri" value="Testues" required><br>
    <input type="email" name="email" placeholder="Email" value="test@example.com" required><br>
    <input name="country" placeholder="Vendi" value="Italy"><br>
    <textarea name="message" placeholder="Mesazhi">Ky është një test.</textarea><br>
    <button type="submit">Dërgo</button>
  </form>
  <pre id="result"></pre>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('https://crm-albtaa-com.vercel.app/api/v1/public/submissions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': 'pk_PfORYReWWPFv134BQgrvF6NfiCxBnOmPe_1LSNoQgi8' },
    body: JSON.stringify({
      formSlug: 'contact',
      firstName: fd.get('firstName'),
      lastName: fd.get('lastName'),
      email: fd.get('email'),
      fields: { country: fd.get('country'), message: fd.get('message') }
    })
  });
  document.getElementById('result').textContent = JSON.stringify(await res.json(), null, 2);
};
</script>
</body>
</html>
